# ===============================
# Bad bot / scanner IP blocklist
# Managed in nginx/blocked-ips.conf — edit there to add or remove IPs.
# ===============================
geo $blocked_ip {
    default 0;
    include /etc/nginx/blocked-ips.conf;
}

# ===============================
# Malicious payload pattern map
# Matches request URI/args against known scanner payloads.
# ===============================
map $request_uri $is_malicious_uri {
    default 0;
    # Path traversal
    "~*\.\./"                                  1;
    "~*\.\.%2[fF]"                             1;
    # PHP exploits (we are a Java app — these are always hostile)
    "~*pearcmd"                                1;
    "~*thinkphp"                               1;
    "~*phpinfo"                                1;
    "~*/\.env(\?|$|/)"                         1;
    "~*/\.git/"                                1;
    "~*wp-(admin|login|content|includes)"      1;
    # Common XSS payloads
    "~*<script"                                1;
    "~*<svg[/\s]"                              1;
    "~*onerror\s*="                            1;
    "~*onload\s*="                             1;
    "~*javascript:"                            1;
    # Spring4Shell / well-known RCE markers
    "~*class\.module\.classLoader"             1;
    # Common shell/etc/passwd probing
    "~*etc/passwd"                             1;
    "~*/bin/sh"                                1;
}

server {
    listen 80;
    listen [::]:80;
    server_name settletree.p-e.kr;

    # Block known scanner IPs (cheap, runs before any other location)
    if ($blocked_ip) { return 444; }
    if ($is_malicious_uri) { return 444; }

    # Let's Encrypt 인증 라우팅 (HTTP)
    location ~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/certbot;
    }

    # 나머지 모든 통신을 HTTPS로 넘깁니다.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name settletree.p-e.kr;

    ssl_certificate /etc/letsencrypt/live/settletree.p-e.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/settletree.p-e.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Drop scanner traffic before it reaches the Spring app
    if ($blocked_ip) { return 444; }
    if ($is_malicious_uri) { return 444; }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
