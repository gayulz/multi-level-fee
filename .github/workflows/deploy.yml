name: Deploy to OCI VM

# main 브랜치에 push 될 때마다 자동으로 이 파이프라인이 실행됩니다.
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build (GitHub Actions) & Deploy (OCI)
    runs-on: ubuntu-latest # GitHub에서 무료로 제공하는 서버에서 실행

    steps:
      # 1. 코드 체크아웃 (GitHub Actions 서버에 현재 코드를 받아옴)
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4

      # 2. Java 17 환경 세팅
      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # 3. Gradle 캐시 설정 (의존성을 반복 다운로드하지 않도록 속도 최적화)
      - name: Gradle 캐시 설정
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # 4. gradlew 실행 권한 부여
      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      # 5. 프로덕션 JAR 빌드 (테스트 제외, GitHub Actions 서버의 안정적인 네트워크 환경에서 실행)
      - name: Gradle Build (테스트 제외)
        run: ./gradlew clean build -x test

      # 6. 빌드된 JAR 파일을 OCI VM 서버로 전송 (SCP)
      - name: OCI 서버로 JAR 파일 전송 (SCP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.OCI_HOST }} # OCI VM 외부 IP (168.107.55.226)
          username: ${{ secrets.OCI_USERNAME }} # OCI SSH 유저명 (ubuntu)
          key: ${{ secrets.OCI_SSH_KEY }}
          source: "build/libs/*.jar,docker-compose.yml,Dockerfile,nginx/"
          target: "/home/${{ secrets.OCI_USERNAME }}/multi-level-fee/"
          strip_components: 0 # 경로 구조 그대로 유지

      # 7. OCI 서버에 SSH 접속 → docker compose 재빌드 및 재시작
      - name: OCI 서버 배포 (SSH)
        uses: appleboy/ssh-action@v1.0.3
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        with:
          host: ${{ secrets.OCI_HOST }}
          username: ${{ secrets.OCI_USERNAME }}
          key: ${{ secrets.OCI_SSH_KEY }}
          envs: SLACK_WEBHOOK_URL
          script: |
            cd ~/multi-level-fee
            touch .env
            get_env_or_default() {
              key="$1"
              default_value="$2"
              current_value="$(grep -m1 "^${key}=" .env | cut -d= -f2- || true)"
              if [ -n "$current_value" ]; then
                printf "%s=%s\n" "$key" "$current_value"
              else
                printf "%s=%s\n" "$key" "$default_value"
              fi
            }

            get_env_or_default "POSTGRES_USER" "settlement" > .env.default
            get_env_or_default "POSTGRES_PASSWORD" "settlement_pass" >> .env.default
            get_env_or_default "POSTGRES_DB" "settlementdb" >> .env.default
            get_env_or_default "RABBITMQ_DEFAULT_USER" "admin" >> .env.default
            get_env_or_default "RABBITMQ_DEFAULT_PASS" "admin_pass" >> .env.default
            echo "SLACK_WEBHOOK_URL=$SLACK_WEBHOOK_URL" >> .env.default
            # 기존 .env에서 위 키를 제외한 커스텀 키 보존 (INIT_SUPER_ADMIN_PASSWORD 등)
            grep -v -E "^(POSTGRES_|RABBITMQ_|SLACK_WEBHOOK_URL)" .env >> .env.default || true
            mv .env.default .env
            # DB/RabbitMQ는 상태ful 서비스이므로 배포 중 중단하지 않고, 기존 컨테이너만 확인합니다.
            for service in postgres rabbitmq; do
              container_id="$(sudo docker-compose ps -q "$service")"
              if [ -n "$container_id" ]; then
                sudo docker start "$container_id" >/dev/null
              else
                sudo docker-compose up -d --no-recreate "$service"
                container_id="$(sudo docker-compose ps -q "$service")"
              fi

              for attempt in $(seq 1 30); do
                health="$(sudo docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_id" 2>/dev/null || true)"
                if [ "$health" = "healthy" ] || [ "$health" = "running" ]; then
                  break
                fi
                if [ "$attempt" = "30" ]; then
                  echo "${service} health check timeout"
                  sudo docker-compose ps
                  exit 1
                fi
                sleep 2
              done
            done
            sudo docker-compose build app
            if [ -z "$(sudo docker-compose ps -q app)" ] && sudo docker ps -a --format '{{.Names}}' | grep -qx "settlement-app"; then
              sudo docker rm -f settlement-app
            fi
            sudo docker-compose up -d --no-deps app
            sudo docker-compose up -d nginx certbot
            
      # 8. 배포 결과 Slack 알림 전송
      - name: Slack 배포 알림 (Success/Failure)
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          author_name: GitHub Actions Deploy
          fields: repo,message,commit,author,action,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} # 슬랙 웹훅 URL
        if: always() # 빌드 실패 / 성공 여부와 상관없이 항상 실행
